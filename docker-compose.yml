services:
  kontekst:
    build: .
    container_name: kontekst
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    env_file: .env
    networks:
      default: {}
      # Ingen fast IP: NPM forwarder til containernavnet (MGMT-256 – 172.18.0.9 ble tatt av en annen container ved omstart)
      npm: {}
      mgmtnet: {}

networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
  mgmtnet:
    external: true
    name: skydotten-mgmt-net
